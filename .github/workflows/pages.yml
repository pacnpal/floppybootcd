name: Deploy GitHub Pages

# Publishes the 90s-style landing page in docs/ to GitHub Pages.
#
# Triggers:
#   - push to main when docs/ or this workflow change (deploys page edits)
#   - release published (refreshes the page so its build-time release
#     snapshot points at the newly published version; the page also
#     fetches live release data client-side as a fallback)
#   - manual dispatch
#
# Setup: in repo Settings -> Pages, set Source = "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deploy at a time. cancel-in-progress: true because a
# tag push commonly fires two events back-to-back (push-to-main +
# release-published) and both deploy the same SHA — github-pages
# rejects the second as a duplicate. Cancelling the older in-flight
# run is safe: the surviving run injects the same (or newer) data.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Fetch latest release metadata
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Pull the latest published (non-draft, non-prerelease) release.
          # If there is none yet, fall back gracefully so the page still
          # builds; the client-side fetch will fill in later.
          if ! gh api "repos/${GITHUB_REPOSITORY}/releases/latest" \
                 --header "Accept: application/vnd.github+json" \
                 > release.json 2>/dev/null; then
            echo "No published release yet — skipping injection."
            echo "injected=false" >> "$GITHUB_OUTPUT"
            echo "null" > release.json
          else
            echo "injected=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Inject release data into index.html
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, re

          page = pathlib.Path("docs/index.html")
          data = json.loads(pathlib.Path("release.json").read_text() or "null")

          if data is None:
              print("No release data — leaving placeholder null.")
              raise SystemExit(0)

          # Slim down to only the fields the page renders. Keeps the HTML
          # small and avoids leaking unrelated API fields.
          slim = {
              "tag_name":     data.get("tag_name"),
              "name":         data.get("name"),
              "html_url":     data.get("html_url"),
              "published_at": data.get("published_at"),
              "assets": [
                  {
                      "name":                 a["name"],
                      "browser_download_url": a["browser_download_url"],
                      "size":                 a.get("size", 0),
                  }
                  for a in data.get("assets", [])
              ],
          }

          src = page.read_text()
          # ensure_ascii=False so non-ASCII chars (em-dashes in release names,
          # smart quotes) stay literal — otherwise json.dumps emits \uXXXX
          # escapes that re.sub interprets as regex replacement templates and
          # explodes with 'bad escape \u'.
          payload = json.dumps(slim, separators=(",", ":"), ensure_ascii=False)
          replacement = "/*BUILD_DATA_START*/" + payload + "/*BUILD_DATA_END*/"
          # Pass replacement as a lambda to bypass re.sub's template parsing
          # entirely — belt-and-suspenders against future escape characters.
          new = re.sub(
              r"/\*BUILD_DATA_START\*/.*?/\*BUILD_DATA_END\*/",
              lambda _m: replacement,
              src,
              count=1,
              flags=re.DOTALL,
          )
          if new == src:
              raise SystemExit("BUILD_DATA marker not found in docs/index.html")
          page.write_text(new)
          print(f"Injected release {slim['tag_name']} ({len(slim['assets'])} assets).")
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Tag pushes commonly fire two events back-to-back: push-to-main
      # (with a docs/ change) and release-published. Both point at the
      # same SHA, so both runs deploy identical content. github-pages
      # rejects the second deploy with a one-second "waiting -> failure"
      # for the same SHA. Detect that case and skip the deploy step
      # instead of letting it fail — the site is already up-to-date.
      - name: Check if current SHA already deployed to Pages
        id: dedup
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Look at the latest 30 github-pages deployments; if any one
          # for this exact SHA succeeded already, skip.
          DEPLOYED=$(gh api \
            "repos/${GITHUB_REPOSITORY}/deployments?environment=github-pages&per_page=30" \
            --jq "[.[] | select(.sha==\"${GITHUB_SHA}\") | .id] | .[]" \
            | head -n 5)
          for id in $DEPLOYED; do
            STATE=$(gh api \
              "repos/${GITHUB_REPOSITORY}/deployments/${id}/statuses" \
              --jq '[.[] | .state] | .[0]')
            if [ "$STATE" = "success" ]; then
              echo "Deployment ${id} for SHA ${GITHUB_SHA} already succeeded — skipping deploy."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Deploy to GitHub Pages
        if: steps.dedup.outputs.skip != 'true'
        id: deployment
        uses: actions/deploy-pages@v4
