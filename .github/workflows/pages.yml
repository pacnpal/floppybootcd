name: Deploy GitHub Pages

# Publishes the 90s-style landing page in docs/ to GitHub Pages.
#
# Triggers:
#   - push to main when docs/ or this workflow change
#   - workflow_run when the "Release Binaries" workflow completes —
#     fires AFTER release.yml has uploaded all assets, so the
#     build-time release snapshot is never injected with an empty
#     `assets: []` (which was the cause of the page briefly showing
#     downloads then flipping to "Couldn't fetch release info")
#   - manual dispatch
#
# Setup: in repo Settings -> Pages, set Source = "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_run:
    workflows: ["Release Binaries"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Serialize deploys but don't cancel — workflow_run normally fires
# minutes after the push-triggered run finishes, so there is no
# in-flight conflict to race against. cancel-in-progress: false also
# avoids a docs push silently killing a still-deploying release run.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Skip when chained off a failed Release Binaries run.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Fetch latest release metadata
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Pick the most recent release that actually has binary assets
          # uploaded. `/releases/latest` alone can return a release that
          # was just created but whose release.yml hasn't finished
          # uploading binaries yet — injecting that empty-assets
          # snapshot makes the client renderer flash through downloads
          # before flipping to the "Couldn't fetch" error. Walking the
          # list and skipping empty releases avoids that race entirely.
          if gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=10" \
                 --header "Accept: application/vnd.github+json" \
                 --jq 'map(select(.draft==false and .prerelease==false and (.assets | length > 0))) | .[0]' \
                 > release.json 2>/dev/null \
             && [ "$(cat release.json)" != "" ] \
             && [ "$(cat release.json)" != "null" ]; then
            TAG=$(jq -r '.tag_name' release.json)
            COUNT=$(jq '.assets | length' release.json)
            echo "Injecting release ${TAG} (${COUNT} assets)."
            echo "injected=true" >> "$GITHUB_OUTPUT"
          else
            echo "No release with assets yet — leaving placeholder null."
            echo "injected=false" >> "$GITHUB_OUTPUT"
            echo "null" > release.json
          fi

      - name: Inject release data into index.html
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, re

          page = pathlib.Path("docs/index.html")
          data = json.loads(pathlib.Path("release.json").read_text() or "null")

          if data is None:
              print("No release data — leaving placeholder null.")
              raise SystemExit(0)

          # Slim down to only the fields the page renders. Keeps the HTML
          # small and avoids leaking unrelated API fields.
          slim = {
              "tag_name":     data.get("tag_name"),
              "name":         data.get("name"),
              "html_url":     data.get("html_url"),
              "published_at": data.get("published_at"),
              "assets": [
                  {
                      "name":                 a["name"],
                      "browser_download_url": a["browser_download_url"],
                      "size":                 a.get("size", 0),
                  }
                  for a in data.get("assets", [])
              ],
          }

          src = page.read_text()
          # ensure_ascii=False so non-ASCII chars (em-dashes in release
          # names, smart quotes) stay literal — otherwise json.dumps emits
          # \uXXXX escapes that re.sub interprets as regex replacement
          # templates and explodes with 'bad escape \u'.
          payload = json.dumps(slim, separators=(",", ":"), ensure_ascii=False)
          replacement = "/*BUILD_DATA_START*/" + payload + "/*BUILD_DATA_END*/"
          # Pass replacement as a lambda to bypass re.sub's template
          # parsing entirely — belt-and-suspenders against future escape
          # characters.
          new = re.sub(
              r"/\*BUILD_DATA_START\*/.*?/\*BUILD_DATA_END\*/",
              lambda _m: replacement,
              src,
              count=1,
              flags=re.DOTALL,
          )
          if new == src:
              raise SystemExit("BUILD_DATA marker not found in docs/index.html")
          page.write_text(new)
          print(f"Injected release {slim['tag_name']} ({len(slim['assets'])} assets).")
          PY

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
