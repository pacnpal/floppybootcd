# Fires a repository_dispatch on pacnpal/POSTBEEPNET so POSTBEEP.NET rebuilds the
# catalog when this project changes its manifest or cuts a release. See
# docs/ADDING_A_PROJECT.md on the hub repo for the POSTBEEP_DISPATCH_PAT
# setup. Generated by postbeep-init; safe to edit, but the hub expects
# the `project-update` event type.
name: Notify POSTBEEP.NET

on:
  release:
    types: [published]
  push:
    branches: [main]
    paths: ['.postbeep/**']
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Fire repository_dispatch
        env:
          GH_TOKEN: ${{ secrets.POSTBEEP_DISPATCH_PAT }}
          PAYLOAD: |
            {
              "event_type": "project-update",
              "client_payload": {
                "project": "${{ github.event.repository.name }}",
                "owner":   "${{ github.repository_owner }}",
                "release": "${{ github.event.release.tag_name || '' }}",
                "ref":     "${{ github.sha }}",
                "reason":  "${{ github.event_name }}"
              }
            }
        run: |
          # gh CLI is preinstalled on ubuntu-latest. Using `gh api` keeps
          # the request authenticated via $GH_TOKEN and gives us actual
          # error messages on a bad token rather than an opaque 401.
          printf '%s' "$PAYLOAD" | gh api \
            repos/pacnpal/POSTBEEPNET/dispatches \
            --method POST \
            --input -
