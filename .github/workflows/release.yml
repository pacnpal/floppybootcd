name: Release Binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to check out for a smoke-test build (e.g. v0.1.0). Leave blank to build the dispatch ref. Manual runs NEVER publish to a Release; only pushed v* tags do."
        required: false
        default: ""

permissions:
  contents: write

# Belt-and-suspenders: even though we pin every JS-based action below
# to a Node-24-native major (checkout v5, setup-python v6, upload/
# download-artifact v6), force any transitive Node-20 action to Node 24
# too. Node 20 is being removed from runners by September 2026.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Stage the Windows xorriso bundle ONCE on a windows-latest runner. The same
  # x86_64 binary is used by both the windows-x86_64 build (native) and the
  # windows-arm64 build (under Windows on ARM x64 emulation). Doing it here
  # avoids running MSYS2 on the windows-11-arm runner, where setup-msys2 is
  # not officially supported.
  prep-xorriso-windows:
    name: Prep xorriso (Windows x86_64, shared with ARM64)
    runs-on: windows-latest
    steps:
      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          update: false
          install: xorriso

      - name: Stage xorriso bundle
        shell: msys2 {0}
        run: |
          set -euo pipefail
          mkdir -p staging-xorriso/bin
          # MSYS2 ships xorriso in the msys repo (Cygwin-style binary).
          # The .exe lives at /usr/bin/xorriso and depends on msys-2.0.dll
          # plus a handful of msys-* runtime DLLs. Copy the binary and
          # every DLL it loads from /usr/bin so the bundle runs anywhere
          # on Windows without an installed MSYS2.
          cp /usr/bin/xorriso staging-xorriso/bin/xorriso.exe
          ldd /usr/bin/xorriso \
            | awk '/=> \/usr\/bin\//{print $3}' \
            | while read -r dll; do
                [ -f "$dll" ] && cp -f "$dll" staging-xorriso/bin/
              done
          # Sanity check that the staged binary runs from outside its
          # original install dir.
          ls -la staging-xorriso/bin/
          ./staging-xorriso/bin/xorriso.exe -version | head -3

      - name: Upload Windows xorriso bundle
        uses: actions/upload-artifact@v6
        with:
          name: xorriso-windows-bundle
          path: staging-xorriso/
          retention-days: 1
          if-no-files-found: error

  build:
    name: Build (${{ matrix.label }})
    needs: [prep-xorriso-windows]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64 — ubuntu-22.04 for glibc 2.35 baseline.
          # PySide6 manylinux_2_34_x86_64 wheel needs glibc >= 2.34, so 22.04
          # is the lowest LTS we can build on. Covers Debian 12 (Bookworm,
          # 2.36), Raspberry Pi OS Bookworm (2.36), Ubuntu 22.04+ (2.35),
          # RHEL/Rocky/Alma 9 (2.34), Fedora 36+ (2.35+), and most other
          # modern distros.
          - os: ubuntu-22.04
            label: linux-x86_64
            artifact_ext: tar.gz
            xorriso_method: linux
          # Linux ARM64 — ubuntu-24.04-arm for glibc 2.39 baseline.
          # PySide6 manylinux_2_39_aarch64 wheel needs glibc >= 2.39, so
          # ubuntu-22.04-arm (2.35) cannot install it. Covers Ubuntu 24.04+
          # (2.39), Debian 13 Trixie+ (2.40), Fedora 40+ (2.39), RHEL 10+,
          # and Raspberry Pi OS Trixie when it ships. Older Pi OS releases
          # (Bookworm, glibc 2.36) need install-from-source via uv +
          # piwheels — see README.
          - os: ubuntu-24.04-arm
            label: linux-arm64
            artifact_ext: tar.gz
            xorriso_method: linux
          # macOS Intel
          - os: macos-15-intel
            label: macos-x86_64
            artifact_ext: zip
            xorriso_method: macos
          # macOS Apple Silicon
          - os: macos-15
            label: macos-arm64
            artifact_ext: zip
            xorriso_method: macos
          # Windows x86_64 — pulls staged xorriso from prep-xorriso-windows.
          - os: windows-latest
            label: windows-x86_64
            artifact_ext: zip
            xorriso_method: windows-shared
          # Windows ARM64 — also pulls the x86_64 xorriso bundle. Windows on
          # ARM ships an x64 emulator, so the x86_64 xorriso.exe runs fine
          # under emulation for our subprocess use case.
          - os: windows-11-arm
            label: windows-arm64
            artifact_ext: zip
            xorriso_method: windows-shared

    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '' && github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # ── xorriso staging ─────────────────────────────────────────────────

      - name: Stage xorriso (Linux)
        if: matrix.xorriso_method == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y xorriso patchelf
          mkdir -p staging-xorriso/bin/lib
          cp /usr/bin/xorriso staging-xorriso/bin/xorriso
          chmod +x staging-xorriso/bin/xorriso
          # Copy every non-glibc shared library xorriso loads. glibc-family
          # libs (libc, ld-linux, libpthread, libdl, libm, librt, libnsl,
          # vdso) are left to the host so we don't ship a glibc that
          # mismatches the kernel.
          ldd staging-xorriso/bin/xorriso \
            | awk '/=> \//{print $3}' \
            | while read -r lib; do
                base=$(basename "$lib")
                case "$base" in
                  libc.so.*|ld-linux*|libpthread.so.*|libdl.so.*|libm.so.*|librt.so.*|libnsl.so.*|linux-vdso.so.*)
                    ;;
                  *)
                    cp -L "$lib" staging-xorriso/bin/lib/
                    ;;
                esac
              done
          # Make the binary find its bundled libs without LD_LIBRARY_PATH.
          patchelf --set-rpath '$ORIGIN/lib' staging-xorriso/bin/xorriso
          # Inter-library deps inside lib/ resolve via $ORIGIN.
          for so in staging-xorriso/bin/lib/*; do
            [ -f "$so" ] && patchelf --set-rpath '$ORIGIN' "$so" || true
          done
          # Sanity check: launch xorriso once via its bundled libs.
          ./staging-xorriso/bin/xorriso -version | head -3

      - name: Stage xorriso (macOS)
        if: matrix.xorriso_method == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          brew install xorriso dylibbundler
          mkdir -p staging-xorriso/bin/libs
          cp "$(brew --prefix)/bin/xorriso" staging-xorriso/bin/xorriso
          chmod +w staging-xorriso/bin/xorriso
          dylibbundler -od -b -x staging-xorriso/bin/xorriso \
            -d "$(pwd)/staging-xorriso/bin/libs" \
            -p '@executable_path/libs/'
          chmod +x staging-xorriso/bin/xorriso
          ./staging-xorriso/bin/xorriso -version | head -3

      - name: Download Windows xorriso bundle (from prep job)
        if: matrix.xorriso_method == 'windows-shared'
        uses: actions/download-artifact@v6
        with:
          name: xorriso-windows-bundle
          path: staging-xorriso/

      # ── PyInstaller build ───────────────────────────────────────────────

      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libxkbcommon0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-sync1 \
            libxcb-xfixes0 \
            libxcb-xinerama0 \
            libxcb-xkb1 \
            libxkbcommon-x11-0 \
            libdbus-1-3 \
            libfontconfig1 \
            libxrender1 \
            libsm6 \
            libice6

      - name: Install Python dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
          python -m pip install pyinstaller

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            REF="${GITHUB_REF#refs/tags/}"
          elif [ -n "${{ github.event.inputs.tag }}" ]; then
            REF="${{ github.event.inputs.tag }}"
          else
            REF="dev-$(git rev-parse --short HEAD)"
          fi
          # Strip leading "v" for use in artifact names.
          VER="${REF#v}"
          echo "tag=${REF}" >> "$GITHUB_OUTPUT"
          echo "version=${VER}" >> "$GITHUB_OUTPUT"

      - name: Build with PyInstaller
        shell: bash
        env:
          PYTHONOPTIMIZE: "1"
        run: |
          # Pick the right per-platform icon for PyInstaller's --icon flag.
          case "${{ runner.os }}" in
            macOS)   ICON=floppybootcd/resources/icon.icns ;;
            Windows) ICON=floppybootcd/resources/icon.ico  ;;
            *)       ICON=floppybootcd/resources/icon.png  ;;
          esac
          # We only use QtCore / QtGui / QtWidgets. --collect-all PySide6
          # otherwise pulls in SQL drivers, QML, QtQuick, multimedia,
          # WebEngine, 3D, etc. — all dead weight that bloats the bundle
          # and triggers PyInstaller "Library not found" warnings when
          # the Qt plugins reference system libs (Postgres.app, libiodbc,
          # libmimerapi, QtQuickShapesDesignHelpers) that don't exist on
          # the CI runner. Excluding them drops the bundle size noticeably
          # and silences the spurious warnings.
          pyinstaller \
            --noconfirm \
            --clean \
            --name floppybootcd \
            --windowed \
            --icon "$ICON" \
            --collect-all floppybootcd \
            --collect-all PySide6 \
            --exclude-module PySide6.QtSql \
            --exclude-module PySide6.QtQml \
            --exclude-module PySide6.QtQmlModels \
            --exclude-module PySide6.QtQmlWorkerScript \
            --exclude-module PySide6.QtQuick \
            --exclude-module PySide6.QtQuickControls2 \
            --exclude-module PySide6.QtQuickWidgets \
            --exclude-module PySide6.QtMultimedia \
            --exclude-module PySide6.QtMultimediaWidgets \
            --exclude-module PySide6.QtNetwork \
            --exclude-module PySide6.QtBluetooth \
            --exclude-module PySide6.QtPositioning \
            --exclude-module PySide6.QtLocation \
            --exclude-module PySide6.QtSensors \
            --exclude-module PySide6.QtSerialPort \
            --exclude-module PySide6.QtWebChannel \
            --exclude-module PySide6.QtWebEngineCore \
            --exclude-module PySide6.QtWebEngineWidgets \
            --exclude-module PySide6.QtWebEngineQuick \
            --exclude-module PySide6.QtWebSockets \
            --exclude-module PySide6.Qt3DAnimation \
            --exclude-module PySide6.Qt3DCore \
            --exclude-module PySide6.Qt3DExtras \
            --exclude-module PySide6.Qt3DInput \
            --exclude-module PySide6.Qt3DLogic \
            --exclude-module PySide6.Qt3DRender \
            --exclude-module PySide6.QtCharts \
            --exclude-module PySide6.QtDataVisualization \
            --exclude-module PySide6.QtPdf \
            --exclude-module PySide6.QtPdfWidgets \
            --exclude-module PySide6.QtTextToSpeech \
            --exclude-module PySide6.QtNfc \
            --exclude-module PySide6.QtRemoteObjects \
            --exclude-module PySide6.QtScxml \
            --exclude-module PySide6.QtStateMachine \
            --exclude-module PySide6.QtTest \
            --exclude-module PySide6.QtHelp \
            --exclude-module PySide6.QtDesigner \
            --exclude-module PySide6.QtUiTools \
            floppybootcd/__main__.py

      - name: Bundle xorriso and license notices into PyInstaller output
        shell: bash
        run: |
          set -euo pipefail
          if [ -d "dist/floppybootcd.app" ]; then
            DEST="dist/floppybootcd.app/Contents/Resources"
          elif [ -d "dist/floppybootcd/_internal" ]; then
            DEST="dist/floppybootcd/_internal"
          elif [ -d "dist/floppybootcd" ]; then
            DEST="dist/floppybootcd"
          else
            echo "Could not find PyInstaller output dir under dist/"
            ls -la dist/
            exit 1
          fi
          mkdir -p "$DEST/bin"
          if [ -d staging-xorriso/bin ]; then
            cp -R staging-xorriso/bin/. "$DEST/bin/"
            echo "Bundled xorriso into $DEST/bin/"
            if [ "${{ matrix.label }}" = "windows-arm64" ]; then
              echo "(Windows ARM64: xorriso is the x86_64 build; runs under Windows on ARM x64 emulation.)"
            fi
          else
            echo "No staged xorriso for ${{ matrix.label }}; shipping notices only."
          fi
          # Always ship third-party notices and the GPLv3 license text.
          cp THIRD_PARTY_NOTICES.md "$DEST/"
          cp LICENSE-xorriso "$DEST/"
          # On macOS, also drop a readable copy at the .app top level so users
          # can find it without right-clicking → Show Package Contents.
          if [ -d "dist/floppybootcd.app" ]; then
            cp THIRD_PARTY_NOTICES.md dist/
            cp LICENSE-xorriso dist/
          fi

      - name: Package Linux build
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cd dist
          tar -czf "floppybootcd-${{ steps.version.outputs.version }}-${{ matrix.label }}.tar.gz" floppybootcd

      # Build AppImage, .deb, and .rpm packages from the PyInstaller bundle.
      # The PyInstaller dir (dist/floppybootcd/) is installed under
      # /usr/lib/floppybootcd/ with a /usr/bin/floppybootcd wrapper, an
      # XDG .desktop entry, and the floppy-disk PNG icon. fpm wraps that
      # tree into .deb and .rpm; appimagetool wraps an AppDir variant.
      - name: Build Linux packages (AppImage, .deb, .rpm)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          VER='${{ steps.version.outputs.version }}'
          LABEL='${{ matrix.label }}'
          case "$LABEL" in
            linux-x86_64) DEB_ARCH=amd64 ; RPM_ARCH=x86_64  ; APPIMG_ARCH=x86_64  ;;
            linux-arm64)  DEB_ARCH=arm64 ; RPM_ARCH=aarch64 ; APPIMG_ARCH=aarch64 ;;
            *) echo "Unknown linux label: $LABEL" ; exit 1 ;;
          esac

          # Stage tree: /usr/lib/floppybootcd/<bundle>, /usr/bin wrapper,
          # XDG .desktop, icon. Used by .deb/.rpm as-is; copied into the
          # AppDir for AppImage.
          STAGE=pkgroot
          rm -rf "$STAGE" AppDir
          mkdir -p \
            "$STAGE/usr/lib/floppybootcd" \
            "$STAGE/usr/bin" \
            "$STAGE/usr/share/applications" \
            "$STAGE/usr/share/icons/hicolor/512x512/apps" \
            "$STAGE/usr/share/doc/floppybootcd"
          cp -R dist/floppybootcd/. "$STAGE/usr/lib/floppybootcd/"

          # /usr/bin wrapper for .deb/.rpm (absolute path is correct
          # post-install). NOT used by the AppImage — see AppRun below.
          cat > "$STAGE/usr/bin/floppybootcd" <<'EOF'
          #!/bin/sh
          exec /usr/lib/floppybootcd/floppybootcd "$@"
          EOF
          chmod +x "$STAGE/usr/bin/floppybootcd"

          cat > "$STAGE/usr/share/applications/floppybootcd.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=FloppyBootCD
          GenericName=Bootable CD Builder
          Comment=Build bootable CDs from collections of floppy disk images
          Exec=floppybootcd %F
          Icon=floppybootcd
          Categories=Utility;System;FileTools;
          Terminal=false
          StartupNotify=true
          EOF

          cp floppybootcd/resources/icon.png \
             "$STAGE/usr/share/icons/hicolor/512x512/apps/floppybootcd.png"
          cp LICENSE LICENSE-xorriso THIRD_PARTY_NOTICES.md \
             "$STAGE/usr/share/doc/floppybootcd/"

          # ── .deb (Debian / Ubuntu / Raspberry Pi OS) ──────────────────
          # ── .rpm (Fedora / RHEL / openSUSE) ───────────────────────────
          # PySide6 wheels bundle Qt itself, but Qt links to system libs
          # for X11, EGL, DBus, fontconfig. Declare those so apt/dnf
          # surface a clear error if a stripped-down install lacks them.
          sudo gem install --no-document fpm

          fpm -s dir -t deb -n floppybootcd -v "$VER" -a "$DEB_ARCH" \
              --description "Build bootable CDs from collections of floppy disk images" \
              --url "https://github.com/pacnpal/floppybootcd" \
              --maintainer "pacnpal <noreply@github.com>" \
              --license "MIT" \
              --vendor "pacnpal" \
              --category "utils" \
              --deb-no-default-config-files \
              -d "libegl1" -d "libxkbcommon0" -d "libxkbcommon-x11-0" \
              -d "libxcb-cursor0" -d "libxcb-icccm4" -d "libxcb-image0" \
              -d "libxcb-keysyms1" -d "libxcb-randr0" -d "libxcb-render-util0" \
              -d "libxcb-shape0" -d "libxcb-sync1" -d "libxcb-xfixes0" \
              -d "libxcb-xinerama0" -d "libxcb-xkb1" \
              -d "libdbus-1-3" -d "libfontconfig1" -d "libxrender1" \
              -d "libsm6" -d "libice6" \
              -p "dist/floppybootcd-${VER}-${LABEL}.deb" \
              -C "$STAGE" usr

          fpm -s dir -t rpm -n floppybootcd -v "$VER" -a "$RPM_ARCH" \
              --description "Build bootable CDs from collections of floppy disk images" \
              --url "https://github.com/pacnpal/floppybootcd" \
              --maintainer "pacnpal <noreply@github.com>" \
              --license "MIT" \
              --vendor "pacnpal" \
              --category "Applications/System" \
              --rpm-summary "Build bootable CDs from floppy disk images" \
              -d "libxkbcommon" -d "libxkbcommon-x11" \
              -d "xcb-util-cursor" -d "xcb-util-image" -d "xcb-util-keysyms" \
              -d "xcb-util-renderutil" -d "xcb-util-wm" -d "libxcb" \
              -d "dbus-libs" -d "fontconfig" -d "libXrender" \
              -d "libSM" -d "libICE" -d "mesa-libEGL" \
              -p "dist/floppybootcd-${VER}-${LABEL}.rpm" \
              -C "$STAGE" usr

          # ── AppImage (universal Linux) ────────────────────────────────
          # Same staged tree, plus an AppRun shim that resolves the
          # bundled binary via $APPDIR (the mount point at runtime), not
          # an absolute path, so the AppImage is relocatable.
          APPDIR=AppDir
          mkdir -p "$APPDIR"
          cp -R "$STAGE/usr" "$APPDIR/usr"
          # appimagetool requires .desktop and icon at the AppDir root.
          cp "$STAGE/usr/share/applications/floppybootcd.desktop" \
             "$APPDIR/floppybootcd.desktop"
          cp floppybootcd/resources/icon.png "$APPDIR/floppybootcd.png"
          cat > "$APPDIR/AppRun" <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/lib/floppybootcd/floppybootcd" "$@"
          EOF
          chmod +x "$APPDIR/AppRun"

          # appimagetool: --appimage-extract-and-run so the build host
          # doesn't need FUSE2. ARCH= tells appimagetool what arch tag to
          # bake into the output runtime.
          wget -q \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${APPIMG_ARCH}.AppImage" \
            -O appimagetool
          chmod +x appimagetool
          ARCH="$APPIMG_ARCH" ./appimagetool \
            --appimage-extract-and-run \
            --no-appstream \
            "$APPDIR" \
            "dist/floppybootcd-${VER}-${LABEL}.AppImage"

          # Sanity: list the four artifacts so a missing one is obvious
          # in the workflow log, not on the release page.
          ls -la dist/floppybootcd-${VER}-${LABEL}.*

      - name: Package macOS build
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cd dist
          # --windowed on macOS produces floppybootcd.app alongside the
          # plain binary directory. Ship the .app bundle.
          if [ -d "floppybootcd.app" ]; then
            ditto -c -k --keepParent --sequesterRsrc \
              "floppybootcd.app" \
              "floppybootcd-${{ steps.version.outputs.version }}-${{ matrix.label }}.zip"
          else
            ditto -c -k --keepParent --sequesterRsrc \
              "floppybootcd" \
              "floppybootcd-${{ steps.version.outputs.version }}-${{ matrix.label }}.zip"
          fi

      - name: Package Windows build
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-Location dist
          Compress-Archive -Path floppybootcd -DestinationPath "floppybootcd-${{ steps.version.outputs.version }}-${{ matrix.label }}.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: floppybootcd-${{ matrix.label }}
          path: dist/floppybootcd-${{ steps.version.outputs.version }}-${{ matrix.label }}.${{ matrix.artifact_ext }}
          if-no-files-found: error
          retention-days: 14

      # Linux-only: separate upload for the AppImage / .deb / .rpm
      # produced by the packaging step above. Kept distinct from the
      # main tar.gz upload so a Linux packaging failure doesn't also
      # kill the tar.gz artifact upload.
      - name: Upload Linux package artifacts
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v6
        with:
          name: floppybootcd-${{ matrix.label }}-packages
          path: |
            dist/floppybootcd-${{ steps.version.outputs.version }}-${{ matrix.label }}.AppImage
            dist/floppybootcd-${{ steps.version.outputs.version }}-${{ matrix.label }}.deb
            dist/floppybootcd-${{ steps.version.outputs.version }}-${{ matrix.label }}.rpm
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish release assets
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v6
        with:
          path: artifacts
          pattern: floppybootcd-*
          merge-multiple: true

      - name: List collected artifacts
        run: ls -la artifacts

      - name: Attach binaries to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          fail_on_unmatched_files: true
          generate_release_notes: true
