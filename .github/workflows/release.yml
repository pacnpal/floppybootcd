name: Release Binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to check out for a smoke-test build (e.g. v0.1.0). Leave blank to build the dispatch ref. Manual runs NEVER publish to a Release; only pushed v* tags do."
        required: false
        default: ""

permissions:
  contents: write

# Belt-and-suspenders: even though we pin every JS-based action below
# to a Node-24-native major (checkout v5, setup-python v6, upload/
# download-artifact v6), force any transitive Node-20 action to Node 24
# too. Node 20 is being removed from runners by September 2026.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Stage the Windows xorriso bundle ONCE on a windows-latest runner. The same
  # x86_64 binary is used by both the windows-x86_64 build (native) and the
  # windows-arm64 build (under Windows on ARM x64 emulation). Doing it here
  # avoids running MSYS2 on the windows-11-arm runner, where setup-msys2 is
  # not officially supported.
  prep-xorriso-windows:
    name: Prep xorriso (Windows x86_64, shared with ARM64)
    runs-on: windows-latest
    steps:
      - name: Set up MSYS2
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
        with:
          msystem: MSYS
          update: false
          install: xorriso

      - name: Stage xorriso bundle
        shell: msys2 {0}
        run: |
          set -euo pipefail
          mkdir -p staging-xorriso/bin
          # MSYS2 ships xorriso in the msys repo (Cygwin-style binary).
          # The .exe lives at /usr/bin/xorriso and depends on msys-2.0.dll
          # plus a handful of msys-* runtime DLLs. Copy the binary and
          # every DLL it loads from /usr/bin so the bundle runs anywhere
          # on Windows without an installed MSYS2.
          cp /usr/bin/xorriso staging-xorriso/bin/xorriso.exe
          ldd /usr/bin/xorriso \
            | awk '/=> \/usr\/bin\//{print $3}' \
            | while read -r dll; do
                [ -f "$dll" ] && cp -f "$dll" staging-xorriso/bin/
              done
          # Sanity check that the staged binary runs from outside its
          # original install dir.
          ls -la staging-xorriso/bin/
          ./staging-xorriso/bin/xorriso.exe -version | head -3

      - name: Upload Windows xorriso bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: xorriso-windows-bundle
          path: staging-xorriso/
          retention-days: 1
          if-no-files-found: error

  build:
    name: Build (${{ matrix.label }})
    needs: [prep-xorriso-windows]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64 — ubuntu-22.04 for glibc 2.35 baseline.
          # PySide6 manylinux_2_34_x86_64 wheel needs glibc >= 2.34, so 22.04
          # is the lowest LTS we can build on. Covers Debian 12 (Bookworm,
          # 2.36), Raspberry Pi OS Bookworm (2.36), Ubuntu 22.04+ (2.35),
          # RHEL/Rocky/Alma 9 (2.34), Fedora 36+ (2.35+), and most other
          # modern distros.
          - os: ubuntu-22.04
            label: linux-x86_64
            artifact_ext: tar.gz
            xorriso_method: linux
          # Linux ARM64 — ubuntu-24.04-arm for glibc 2.39 baseline.
          # PySide6 manylinux_2_39_aarch64 wheel needs glibc >= 2.39, so
          # ubuntu-22.04-arm (2.35) cannot install it. Covers Ubuntu 24.04+
          # (2.39), Debian 13 Trixie+ (2.40), Fedora 40+ (2.39), RHEL 10+,
          # and Raspberry Pi OS Trixie when it ships. Older Pi OS releases
          # (Bookworm, glibc 2.36) need install-from-source via uv +
          # piwheels — see README.
          - os: ubuntu-24.04-arm
            label: linux-arm64
            artifact_ext: tar.gz
            xorriso_method: linux
          # macOS Intel
          - os: macos-15-intel
            label: macos-x86_64
            artifact_ext: zip
            xorriso_method: macos
          # macOS Apple Silicon
          - os: macos-15
            label: macos-arm64
            artifact_ext: zip
            xorriso_method: macos
          # Windows x86_64 — pulls staged xorriso from prep-xorriso-windows.
          - os: windows-latest
            label: windows-x86_64
            artifact_ext: zip
            xorriso_method: windows-shared
          # Windows ARM64 — also pulls the x86_64 xorriso bundle. Windows on
          # ARM ships an x64 emulator, so the x86_64 xorriso.exe runs fine
          # under emulation for our subprocess use case.
          - os: windows-11-arm
            label: windows-arm64
            artifact_ext: zip
            xorriso_method: windows-shared

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '' && github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      # The checkout above may be a historical tag (the workflow_dispatch
      # smoke-test path), and tags older than this workflow do not contain
      # .github/signing/. Pull the signing tooling from the dispatch
      # revision separately so a rebuild of an old tag is still signed
      # with the current scripts.
      - name: Check out signing tooling
        if: runner.os == 'macOS'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref }}
          path: .signing-tooling
          sparse-checkout: .github/signing
          sparse-checkout-cone-mode: false
          fetch-depth: 1

      - name: Locate signing tooling
        id: signing
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          DIR=".signing-tooling/.github/signing"
          if [ -x "$DIR/macos-sign.sh" ]; then
            echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          else
            echo "dir=" >> "$GITHUB_OUTPUT"
            echo "::warning::No signing tooling at $DIR — is this a revision that predates macOS signing? macOS bundles will keep their ad-hoc signature."
          fi

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      # ── xorriso staging ─────────────────────────────────────────────────

      - name: Stage xorriso (Linux)
        if: matrix.xorriso_method == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y xorriso patchelf
          mkdir -p staging-xorriso/bin/lib
          cp /usr/bin/xorriso staging-xorriso/bin/xorriso
          chmod +x staging-xorriso/bin/xorriso
          # Copy every non-glibc shared library xorriso loads. glibc-family
          # libs (libc, ld-linux, libpthread, libdl, libm, librt, libnsl,
          # vdso) are left to the host so we don't ship a glibc that
          # mismatches the kernel.
          ldd staging-xorriso/bin/xorriso \
            | awk '/=> \//{print $3}' \
            | while read -r lib; do
                base=$(basename "$lib")
                case "$base" in
                  libc.so.*|ld-linux*|libpthread.so.*|libdl.so.*|libm.so.*|librt.so.*|libnsl.so.*|linux-vdso.so.*)
                    ;;
                  *)
                    cp -L "$lib" staging-xorriso/bin/lib/
                    ;;
                esac
              done
          # Make the binary find its bundled libs without LD_LIBRARY_PATH.
          patchelf --set-rpath '$ORIGIN/lib' staging-xorriso/bin/xorriso
          # Inter-library deps inside lib/ resolve via $ORIGIN.
          for so in staging-xorriso/bin/lib/*; do
            [ -f "$so" ] && patchelf --set-rpath '$ORIGIN' "$so" || true
          done
          # Sanity check: launch xorriso once via its bundled libs.
          ./staging-xorriso/bin/xorriso -version | head -3

      - name: Stage xorriso (macOS)
        if: matrix.xorriso_method == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          brew install xorriso dylibbundler
          mkdir -p staging-xorriso/bin/libs
          cp "$(brew --prefix)/bin/xorriso" staging-xorriso/bin/xorriso
          chmod +w staging-xorriso/bin/xorriso
          dylibbundler -od -b -x staging-xorriso/bin/xorriso \
            -d "$(pwd)/staging-xorriso/bin/libs" \
            -p '@executable_path/libs/'
          chmod +x staging-xorriso/bin/xorriso
          ./staging-xorriso/bin/xorriso -version | head -3

      - name: Download Windows xorriso bundle (from prep job)
        if: matrix.xorriso_method == 'windows-shared'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: xorriso-windows-bundle
          path: staging-xorriso/

      # ── PyInstaller build ───────────────────────────────────────────────

      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libxkbcommon0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-sync1 \
            libxcb-xfixes0 \
            libxcb-xinerama0 \
            libxcb-xkb1 \
            libxkbcommon-x11-0 \
            libdbus-1-3 \
            libfontconfig1 \
            libxrender1 \
            libsm6 \
            libice6

      - name: Install Python dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
          python -m pip install pyinstaller

      # PyInstaller scans the PySide6 install in site-packages and warns
      # whenever a bundled Qt plugin .dylib/.so/.dll references a host
      # path that doesn't exist on the build runner (libmimerapi, libpq,
      # libiodbc, QtQuickShapesDesignHelpers). --exclude-module only
      # filters Python imports — the native plugin files are still on
      # disk for PyInstaller to scan and complain about. Delete them
      # from site-packages BEFORE pyinstaller runs so it never sees
      # them. Mirrors the post-build prune step further down, so
      # nothing the running app needs is touched.
      - name: Pre-prune PySide6 install (silence PyInstaller warnings)
        shell: bash
        run: |
          set -euo pipefail
          PYSIDE_DIR=$(python -c "import PySide6, os; print(os.path.dirname(PySide6.__file__))")
          echo "Pre-pruning $PYSIDE_DIR"
          QT="$PYSIDE_DIR/Qt"
          if [ -d "$QT/plugins" ]; then
            for p in sqldrivers multimedia mediaservice \
                     position geoservices texttospeech \
                     webview networkinformation tls canbus \
                     sensors sensorgestures gamepads \
                     designer renderers qmltooling \
                     scxmldatamodel assetimporters; do
              if [ -d "$QT/plugins/$p" ]; then
                rm -rf "$QT/plugins/$p"
                echo "  removed Qt/plugins/$p"
              fi
            done
          fi
          # QML imports include QtQuick.Shapes.DesignHelpers which
          # @rpaths into a framework we don't ship.
          if [ -d "$QT/qml" ]; then
            rm -rf "$QT/qml"
            echo "  removed Qt/qml"
          fi
          # Locale .qm files; app is English-only.
          if [ -d "$QT/translations" ]; then
            rm -rf "$QT/translations"
            echo "  removed Qt/translations"
          fi

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            REF="${GITHUB_REF#refs/tags/}"
          elif [ -n "${{ github.event.inputs.tag }}" ]; then
            REF="${{ github.event.inputs.tag }}"
          else
            REF="dev-$(git rev-parse --short HEAD)"
          fi
          # Strip leading "v" for use in artifact names.
          VER="${REF#v}"
          echo "tag=${REF}" >> "$GITHUB_OUTPUT"
          echo "version=${VER}" >> "$GITHUB_OUTPUT"

      - name: Build with PyInstaller
        shell: bash
        env:
          PYTHONOPTIMIZE: "1"
        run: |
          # Pick the right per-platform icon for PyInstaller's --icon flag.
          case "${{ runner.os }}" in
            macOS)   ICON=floppybootcd/resources/icon.icns ;;
            Windows) ICON=floppybootcd/resources/icon.ico  ;;
            *)       ICON=floppybootcd/resources/icon.png  ;;
          esac
          # We only use QtCore / QtGui / QtWidgets. --collect-all PySide6
          # otherwise pulls in SQL drivers, QML, QtQuick, multimedia,
          # WebEngine, 3D, etc. — all dead weight that bloats the bundle
          # and triggers PyInstaller "Library not found" warnings when
          # the Qt plugins reference system libs (Postgres.app, libiodbc,
          # libmimerapi, QtQuickShapesDesignHelpers) that don't exist on
          # the CI runner. Excluding them drops the bundle size noticeably
          # and silences the spurious warnings.
          pyinstaller \
            --noconfirm \
            --clean \
            --name floppybootcd \
            --windowed \
            --icon "$ICON" \
            --collect-all floppybootcd \
            --collect-all PySide6 \
            --collect-all certifi \
            --exclude-module PySide6.QtSql \
            --exclude-module PySide6.QtQml \
            --exclude-module PySide6.QtQmlModels \
            --exclude-module PySide6.QtQmlWorkerScript \
            --exclude-module PySide6.QtQuick \
            --exclude-module PySide6.QtQuickControls2 \
            --exclude-module PySide6.QtQuickWidgets \
            --exclude-module PySide6.QtMultimedia \
            --exclude-module PySide6.QtMultimediaWidgets \
            --exclude-module PySide6.QtNetwork \
            --exclude-module PySide6.QtBluetooth \
            --exclude-module PySide6.QtPositioning \
            --exclude-module PySide6.QtLocation \
            --exclude-module PySide6.QtSensors \
            --exclude-module PySide6.QtSerialPort \
            --exclude-module PySide6.QtWebChannel \
            --exclude-module PySide6.QtWebEngineCore \
            --exclude-module PySide6.QtWebEngineWidgets \
            --exclude-module PySide6.QtWebEngineQuick \
            --exclude-module PySide6.QtWebSockets \
            --exclude-module PySide6.Qt3DAnimation \
            --exclude-module PySide6.Qt3DCore \
            --exclude-module PySide6.Qt3DExtras \
            --exclude-module PySide6.Qt3DInput \
            --exclude-module PySide6.Qt3DLogic \
            --exclude-module PySide6.Qt3DRender \
            --exclude-module PySide6.QtCharts \
            --exclude-module PySide6.QtDataVisualization \
            --exclude-module PySide6.QtPdf \
            --exclude-module PySide6.QtPdfWidgets \
            --exclude-module PySide6.QtTextToSpeech \
            --exclude-module PySide6.QtNfc \
            --exclude-module PySide6.QtRemoteObjects \
            --exclude-module PySide6.QtScxml \
            --exclude-module PySide6.QtStateMachine \
            --exclude-module PySide6.QtTest \
            --exclude-module PySide6.QtHelp \
            --exclude-module PySide6.QtDesigner \
            --exclude-module PySide6.QtUiTools \
            floppybootcd/__main__.py

      # Drop runtime-unused PySide6 and Qt assets that --collect-all
      # pulls in by default. Each prune target is either compile-time
      # only (typesystems/, include/, glue/, support/) or locale/UI
      # content we don't ship (Qt translations for 30+ languages, QML
      # imports we don't load) or stray plugin dirs that aren't always
      # caught by --exclude-module (Qt's PySide6 hook can re-add them).
      # No behavior change — every file removed here is something the
      # running app never reads.
      - name: Prune unused Qt and PySide6 resources
        shell: bash
        run: |
          set -euo pipefail
          before=$(du -sh dist 2>/dev/null | awk '{print $1}' || echo "?")
          echo "Bundle size before prune: ${before}"

          # Find the PySide6 root (path differs between macOS .app and
          # plain --windowed dir layouts).
          for candidate in \
              dist/floppybootcd.app/Contents/Resources/PySide6 \
              dist/floppybootcd.app/Contents/MacOS/PySide6 \
              dist/floppybootcd/_internal/PySide6 \
              dist/floppybootcd/PySide6; do
            if [ -d "$candidate" ]; then
              PYSIDE_ROOT="$candidate"
              break
            fi
          done
          if [ -z "${PYSIDE_ROOT:-}" ]; then
            echo "No PySide6 dir found under dist/; skipping prune."
            ls -la dist/ || true
            exit 0
          fi
          echo "Pruning $PYSIDE_ROOT"

          # PySide6 compile-time / dev-only dirs.
          for d in typesystems include glue support examples scripts; do
            if [ -d "$PYSIDE_ROOT/$d" ]; then
              rm -rf "$PYSIDE_ROOT/$d"
              echo "  removed PySide6/$d"
            fi
          done

          # PySide6 CLI tools the bundled app never invokes
          # (rcc/uic/designer/lupdate/lrelease/qmllint/deploy/etc.).
          # Glob-safe: only touch executables under PySide6 root.
          find "$PYSIDE_ROOT" -maxdepth 2 -type f \
            \( -name 'pyside6-*' -o -name 'shiboken6' \
               -o -name 'shiboken6-genpyi' -o -name 'rcc*' \
               -o -name 'uic*' -o -name 'qmllint*' -o -name 'qmlformat*' \
               -o -name 'qmltyperegistrar*' -o -name 'qmlimportscanner*' \) \
            -print -delete 2>/dev/null || true

          # macOS only: PyInstaller relocates Qt's nested tool bundles
          # (Assistant.app, Designer.app, Linguist.app, ...) into
          # Contents/Frameworks under a mangled "<name>__dot__app" name —
          # a real directory whose Contents/Info.plist is a symlink back
          # into Contents/Resources. codesign refuses to sign a bundle
          # laid out that way ("the main executable or Info.plist must be
          # a regular file (no symlinks, etc.)"), which fails the release
          # build outright. These are Qt developer tools: this app links
          # QtCore/QtGui/QtWidgets only, and QtHelp — the module that
          # would drive Assistant — is already excluded, so nothing can
          # launch any of them. Dropping them fixes signing and shrinks
          # the bundle.
          #
          # QtWebEngineProcess is the one nested app Qt genuinely needs at
          # runtime, and it is handled differently: it cannot simply be
          # pruned (that would ship a broken WebEngine) and it cannot be
          # signed as-is either, since it has the same symlinked
          # Info.plist. It cannot appear today — every WebEngine module is
          # excluded — so if it ever does, stop the build and say what has
          # to happen, rather than failing later inside codesign or
          # shipping something broken.
          if [ -d "dist/floppybootcd.app" ]; then
            for nested_root in \
                dist/floppybootcd.app/Contents/Frameworks/PySide6 \
                dist/floppybootcd.app/Contents/Resources/PySide6; do
              [ -d "$nested_root" ] || continue
              # Capture rather than pipe from a process substitution: a
              # find(1) failure inside <(...) does not propagate under
              # set -e, so a broken scan would silently sweep nothing and
              # the build would fail later inside codesign with no clue
              # why. Command substitution makes find's exit status
              # observable, so a failed scan stops the build here. (Names
              # are Qt bundle names — no newlines to split on.)
              if ! nested_apps=$(find "$nested_root" -maxdepth 3 -name '*__dot__app'); then
                echo "ERROR: could not scan $nested_root for nested app bundles." >&2
                exit 1
              fi
              [ -n "$nested_apps" ] || continue
              while IFS= read -r nested; do
                [ -n "$nested" ] || continue
                base=$(basename "$nested")
                case "$base" in
                  *WebEngine*)
                    echo "ERROR: $base is in the bundle." >&2
                    echo "       Qt needs it at runtime, so it must not be pruned, but" >&2
                    echo "       PyInstaller's mangled layout (a symlinked" >&2
                    echo "       Contents/Info.plist) is unsignable as it stands." >&2
                    echo "       Re-enabling WebEngine means rebuilding this helper into" >&2
                    echo "       a signable layout — a real Info.plist inside the bundle —" >&2
                    echo "       before macOS artifacts can ship." >&2
                    exit 1
                    ;;
                esac
                rm -rf "$nested"
                echo "  removed ${nested#dist/floppybootcd.app/Contents/}"
              done <<< "$nested_apps"
            done
          fi

          # Qt resources inside PySide6/Qt/.
          QT_ROOT="$PYSIDE_ROOT/Qt"
          if [ -d "$QT_ROOT" ]; then
            # Translations: app is English-only.
            [ -d "$QT_ROOT/translations" ] && rm -rf "$QT_ROOT/translations" \
              && echo "  removed Qt/translations" || true

            # QML imports: no QtQuick/QtQml usage in the app.
            [ -d "$QT_ROOT/qml" ] && rm -rf "$QT_ROOT/qml" \
              && echo "  removed Qt/qml" || true

            # Plugin subdirs for features we don't use. The
            # --exclude-module flags above should drop most of these,
            # but PySide6's PyInstaller hook can re-add the plugin
            # dirs even when the Python module is excluded.
            if [ -d "$QT_ROOT/plugins" ]; then
              for p in sqldrivers multimedia mediaservice \
                       position geoservices texttospeech \
                       webview networkinformation tls canbus \
                       sensors sensorgestures gamepads \
                       designer renderers qmltooling \
                       scxmldatamodel assetimporters; do
                if [ -d "$QT_ROOT/plugins/$p" ]; then
                  rm -rf "$QT_ROOT/plugins/$p"
                  echo "  removed Qt/plugins/$p"
                fi
              done
            fi
          fi

          after=$(du -sh dist 2>/dev/null | awk '{print $1}' || echo "?")
          echo "Bundle size after prune:  ${after}"

      # macOS only: patch the .app's Info.plist with CFBundleDocumentTypes
      # + UTExportedTypeDeclarations so Finder routes .fbcd double-clicks
      # (and File→Open Recent / drag-to-dock) to FloppyBootCD. The runtime
      # picks the path up via QFileOpenEvent (see app.FloppyBootCDApplication).
      - name: Register .fbcd file type in macOS Info.plist
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          PLIST="dist/floppybootcd.app/Contents/Info.plist"
          if [ ! -f "$PLIST" ]; then
            echo "Info.plist not found at $PLIST — skipping association registration."
            ls -la dist/ || true
            exit 0
          fi
          python3 - <<'PY'
          import plistlib, pathlib
          plist = pathlib.Path("dist/floppybootcd.app/Contents/Info.plist")
          info = plistlib.loads(plist.read_bytes())
          # Merge our document-type entry into the existing list so we
          # don't discard any PyInstaller-generated entries. Overwrite
          # an existing entry whose identifier matches ours; append if
          # no match is found.
          our_doc_type = {
              "CFBundleTypeName": "FloppyBootCD Project",
              "CFBundleTypeRole": "Editor",
              "CFBundleTypeExtensions": ["fbcd"],
              "CFBundleTypeIconFile": "icon-windowed.icns",
              "LSHandlerRank": "Owner",
              "LSItemContentTypes": ["com.pacnpal.floppybootcd.project"],
          }
          existing_doc_types = info.get("CFBundleDocumentTypes", [])
          for i, entry in enumerate(existing_doc_types):
              if "com.pacnpal.floppybootcd.project" in entry.get("LSItemContentTypes", []):
                  existing_doc_types[i] = our_doc_type
                  break
          else:
              existing_doc_types.append(our_doc_type)
          info["CFBundleDocumentTypes"] = existing_doc_types
          our_uti = {
              "UTTypeIdentifier": "com.pacnpal.floppybootcd.project",
              "UTTypeDescription": "FloppyBootCD Project",
              "UTTypeConformsTo": ["public.data", "public.content"],
              "UTTypeTagSpecification": {
                  "public.filename-extension": ["fbcd"],
                  "public.mime-type": ["application/x-floppybootcd-project"],
              },
          }
          existing_utis = info.get("UTExportedTypeDeclarations", [])
          for i, entry in enumerate(existing_utis):
              if entry.get("UTTypeIdentifier") == "com.pacnpal.floppybootcd.project":
                  existing_utis[i] = our_uti
                  break
          else:
              existing_utis.append(our_uti)
          info["UTExportedTypeDeclarations"] = existing_utis
          # Set the bundle identifier explicitly so Launch Services keys
          # association entries to a stable ID instead of the per-build
          # PyInstaller default.
          info["CFBundleIdentifier"] = "com.pacnpal.floppybootcd"
          plist.write_bytes(plistlib.dumps(info))
          print("Patched Info.plist for .fbcd association.")
          PY

      - name: Bundle xorriso and license notices into PyInstaller output
        shell: bash
        run: |
          set -euo pipefail
          if [ -d "dist/floppybootcd.app" ]; then
            DEST="dist/floppybootcd.app/Contents/Resources"
          elif [ -d "dist/floppybootcd/_internal" ]; then
            DEST="dist/floppybootcd/_internal"
          elif [ -d "dist/floppybootcd" ]; then
            DEST="dist/floppybootcd"
          else
            echo "Could not find PyInstaller output dir under dist/"
            ls -la dist/
            exit 1
          fi
          mkdir -p "$DEST/bin"
          if [ -d staging-xorriso/bin ]; then
            cp -R staging-xorriso/bin/. "$DEST/bin/"
            echo "Bundled xorriso into $DEST/bin/"
            if [ "${{ matrix.label }}" = "windows-arm64" ]; then
              echo "(Windows ARM64: xorriso is the x86_64 build; runs under Windows on ARM x64 emulation.)"
            fi
          else
            echo "No staged xorriso for ${{ matrix.label }}; shipping notices only."
          fi
          # Always ship third-party notices and the GPLv3 license text.
          cp THIRD_PARTY_NOTICES.md "$DEST/"
          cp LICENSE-xorriso "$DEST/"
          # On macOS, also drop a readable copy at the .app top level so users
          # can find it without right-clicking → Show Package Contents.
          if [ -d "dist/floppybootcd.app" ]; then
            cp THIRD_PARTY_NOTICES.md dist/
            cp LICENSE-xorriso dist/
          fi
          # Windows: surface the .fbcd registration helpers at the top of
          # the zip so users see them without digging into _internal/.
          # Double-clicking register-fbcd-windows.bat associates .fbcd
          # files with this app for the current user; unregister-fbcd-windows.bat
          # backs it out. Per-user (HKCU) keeps the elevation prompt away.
          # .bat (not .reg) because .reg files store strings as REG_SZ
          # which doesn't expand %LOCALAPPDATA% / %~dp0 at runtime;
          # reg add /t REG_EXPAND_SZ does, and the .bat resolves its
          # own install dir via %~dp0 so the path is always right.
          if [ "${{ runner.os }}" = "Windows" ] && [ -d "dist/floppybootcd" ]; then
            cp floppybootcd/resources/register-fbcd-windows.bat dist/floppybootcd/ || true
            cp floppybootcd/resources/unregister-fbcd-windows.bat dist/floppybootcd/ || true
          fi

      - name: Package Linux build
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cd dist
          tar -czf "floppybootcd-${{ steps.version.outputs.version }}-${{ matrix.label }}.tar.gz" floppybootcd

      # Build AppImage, .deb, and .rpm packages from the PyInstaller bundle.
      # The PyInstaller dir (dist/floppybootcd/) is installed under
      # /usr/lib/floppybootcd/ with a /usr/bin/floppybootcd wrapper, an
      # XDG .desktop entry, and the floppy-disk PNG icon. fpm wraps that
      # tree into .deb and .rpm; appimagetool wraps an AppDir variant.
      - name: Build Linux packages (AppImage, .deb, .rpm)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          VER='${{ steps.version.outputs.version }}'
          LABEL='${{ matrix.label }}'
          case "$LABEL" in
            linux-x86_64) DEB_ARCH=amd64 ; RPM_ARCH=x86_64  ; APPIMG_ARCH=x86_64  ;;
            linux-arm64)  DEB_ARCH=arm64 ; RPM_ARCH=aarch64 ; APPIMG_ARCH=aarch64 ;;
            *) echo "Unknown linux label: $LABEL" ; exit 1 ;;
          esac

          # Stage tree: /usr/lib/floppybootcd/<bundle>, /usr/bin wrapper,
          # XDG .desktop, icon. Used by .deb/.rpm as-is; copied into the
          # AppDir for AppImage.
          STAGE=pkgroot
          rm -rf "$STAGE" AppDir
          mkdir -p \
            "$STAGE/usr/lib/floppybootcd" \
            "$STAGE/usr/bin" \
            "$STAGE/usr/share/applications" \
            "$STAGE/usr/share/icons/hicolor/512x512/apps" \
            "$STAGE/usr/share/doc/floppybootcd"
          cp -R dist/floppybootcd/. "$STAGE/usr/lib/floppybootcd/"

          # /usr/bin wrapper for .deb/.rpm (absolute path is correct
          # post-install). NOT used by the AppImage — see AppRun below.
          cat > "$STAGE/usr/bin/floppybootcd" <<'EOF'
          #!/bin/sh
          exec /usr/lib/floppybootcd/floppybootcd "$@"
          EOF
          chmod +x "$STAGE/usr/bin/floppybootcd"

          cat > "$STAGE/usr/share/applications/floppybootcd.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=FloppyBootCD
          GenericName=Bootable CD Builder
          Comment=Build bootable CDs from collections of floppy disk images
          Exec=floppybootcd %F
          Icon=floppybootcd
          Categories=Utility;System;FileTools;
          Terminal=false
          StartupNotify=true
          MimeType=application/x-floppybootcd-project;
          EOF

          # Freedesktop shared-mime-info entry. File managers
          # (Nautilus, Dolphin, Thunar, ...) consult this database
          # to decide which application opens a given file. The
          # post-install hook below runs `update-mime-database` so
          # the new type takes effect without a logout.
          mkdir -p "$STAGE/usr/share/mime/packages"
          cp floppybootcd/resources/floppybootcd.xml \
             "$STAGE/usr/share/mime/packages/floppybootcd.xml"

          cp floppybootcd/resources/icon.png \
             "$STAGE/usr/share/icons/hicolor/512x512/apps/floppybootcd.png"
          cp LICENSE LICENSE-xorriso THIRD_PARTY_NOTICES.md \
             "$STAGE/usr/share/doc/floppybootcd/"

          # ── post-install / post-uninstall scripts ──────────────────
          # Rebuild the MIME and desktop databases so .fbcd association
          # picks up immediately. `command -v` so missing tools (very
          # stripped-down installs) don't break the install.
          mkdir -p scripts
          cat > scripts/post-install.sh <<'EOF'
          #!/bin/sh
          set -e
          if command -v update-mime-database >/dev/null 2>&1; then
            update-mime-database /usr/share/mime || true
          fi
          if command -v update-desktop-database >/dev/null 2>&1; then
            update-desktop-database -q /usr/share/applications || true
          fi
          if command -v gtk-update-icon-cache >/dev/null 2>&1; then
            gtk-update-icon-cache -q -t /usr/share/icons/hicolor || true
          fi
          exit 0
          EOF
          chmod +x scripts/post-install.sh
          # Re-use the same script for post-remove so the database
          # caches are refreshed when the .desktop / mime XML goes
          # away on uninstall.
          cp scripts/post-install.sh scripts/post-remove.sh

          # ── .deb (Debian / Ubuntu / Raspberry Pi OS) ──────────────────
          # ── .rpm (Fedora / RHEL / openSUSE) ───────────────────────────
          # PySide6 wheels bundle Qt itself, but Qt links to system libs
          # for X11, EGL, DBus, fontconfig. Declare those so apt/dnf
          # surface a clear error if a stripped-down install lacks them.
          sudo gem install --no-document fpm

          fpm -s dir -t deb -n floppybootcd -v "$VER" -a "$DEB_ARCH" \
              --description "Build bootable CDs from collections of floppy disk images" \
              --url "https://github.com/pacnpal/floppybootcd" \
              --maintainer "pacnpal <noreply@github.com>" \
              --license "MIT" \
              --vendor "pacnpal" \
              --category "utils" \
              --deb-no-default-config-files \
              --after-install scripts/post-install.sh \
              --after-remove scripts/post-remove.sh \
              -d "libegl1" -d "libxkbcommon0" -d "libxkbcommon-x11-0" \
              -d "libxcb-cursor0" -d "libxcb-icccm4" -d "libxcb-image0" \
              -d "libxcb-keysyms1" -d "libxcb-randr0" -d "libxcb-render-util0" \
              -d "libxcb-shape0" -d "libxcb-sync1" -d "libxcb-xfixes0" \
              -d "libxcb-xinerama0" -d "libxcb-xkb1" \
              -d "libdbus-1-3" -d "libfontconfig1" -d "libxrender1" \
              -d "libsm6" -d "libice6" \
              -p "dist/floppybootcd-${VER}-${LABEL}.deb" \
              -C "$STAGE" usr

          fpm -s dir -t rpm -n floppybootcd -v "$VER" -a "$RPM_ARCH" \
              --description "Build bootable CDs from collections of floppy disk images" \
              --url "https://github.com/pacnpal/floppybootcd" \
              --maintainer "pacnpal <noreply@github.com>" \
              --license "MIT" \
              --vendor "pacnpal" \
              --category "Applications/System" \
              --rpm-summary "Build bootable CDs from floppy disk images" \
              --after-install scripts/post-install.sh \
              --after-remove scripts/post-remove.sh \
              -d "libxkbcommon" -d "libxkbcommon-x11" \
              -d "xcb-util-cursor" -d "xcb-util-image" -d "xcb-util-keysyms" \
              -d "xcb-util-renderutil" -d "xcb-util-wm" -d "libxcb" \
              -d "dbus-libs" -d "fontconfig" -d "libXrender" \
              -d "libSM" -d "libICE" -d "mesa-libEGL" \
              -p "dist/floppybootcd-${VER}-${LABEL}.rpm" \
              -C "$STAGE" usr

          # ── AppImage (universal Linux) ────────────────────────────────
          # Same staged tree, plus an AppRun shim that resolves the
          # bundled binary via $APPDIR (the mount point at runtime), not
          # an absolute path, so the AppImage is relocatable.
          APPDIR=AppDir
          mkdir -p "$APPDIR"
          cp -R "$STAGE/usr" "$APPDIR/usr"
          # appimagetool requires .desktop and icon at the AppDir root.
          cp "$STAGE/usr/share/applications/floppybootcd.desktop" \
             "$APPDIR/floppybootcd.desktop"
          cp floppybootcd/resources/icon.png "$APPDIR/floppybootcd.png"
          cat > "$APPDIR/AppRun" <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/lib/floppybootcd/floppybootcd" "$@"
          EOF
          chmod +x "$APPDIR/AppRun"

          # appimagetool: --appimage-extract-and-run so the build host
          # doesn't need FUSE2. ARCH= tells appimagetool what arch tag to
          # bake into the output runtime.
          wget -q \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${APPIMG_ARCH}.AppImage" \
            -O appimagetool
          chmod +x appimagetool
          ARCH="$APPIMG_ARCH" ./appimagetool \
            --appimage-extract-and-run \
            --no-appstream \
            "$APPDIR" \
            "dist/floppybootcd-${VER}-${LABEL}.AppImage"

          # Sanity: list the four artifacts so a missing one is obvious
          # in the workflow log, not on the release page.
          ls -la dist/floppybootcd-${VER}-${LABEL}.*

      # ── macOS code signing ──────────────────────────────────────────────
      # Signing has to happen HERE: after the Info.plist patch and the
      # xorriso / license-notice copy above, and immediately before the
      # bundle is zipped below. Every mutation of a bundle invalidates its
      # signature, so signing any earlier — including via PyInstaller's
      # --codesign-identity — would simply be undone by the steps in
      # between.
      #
      # Both steps degrade gracefully when the signing secrets aren't
      # configured (fork PRs, or a repo that hasn't set them up): the
      # import is a no-op and the bundle gets the same ad-hoc signature it
      # carried before signing was wired up.

      - name: Import Developer ID certificate (macOS)
        if: runner.os == 'macOS' && steps.signing.outputs.dir != ''
        shell: bash
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
        run: ${{ steps.signing.outputs.dir }}/macos-import-cert.sh

      - name: Codesign macOS .app
        if: runner.os == 'macOS' && steps.signing.outputs.dir != ''
        shell: bash
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          set -euo pipefail
          if [ -d "dist/floppybootcd.app" ]; then
            ${{ steps.signing.outputs.dir }}/macos-sign.sh dist/floppybootcd.app
          else
            echo "No .app bundle in dist/ — nothing to sign."
          fi

      - name: Package macOS build
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cd dist
          # --windowed on macOS produces floppybootcd.app alongside the
          # plain binary directory. Ship the .app bundle.
          if [ -d "floppybootcd.app" ]; then
            ditto -c -k --keepParent --sequesterRsrc \
              "floppybootcd.app" \
              "floppybootcd-${{ steps.version.outputs.version }}-${{ matrix.label }}.zip"
          else
            ditto -c -k --keepParent --sequesterRsrc \
              "floppybootcd" \
              "floppybootcd-${{ steps.version.outputs.version }}-${{ matrix.label }}.zip"
          fi

      # Notarization runs on the zip the step above just produced, then
      # staples the returned ticket to the .app and re-zips — a ticket
      # can't live in the archive, only in the bundle. Without the staple,
      # a Mac with no network access to Apple can't verify the app.
      - name: Notarize and staple macOS build
        if: runner.os == 'macOS' && steps.signing.outputs.dir != ''
        shell: bash
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          set -euo pipefail
          APP="dist/floppybootcd.app"
          ZIP="dist/floppybootcd-${{ steps.version.outputs.version }}-${{ matrix.label }}.zip"
          if [ ! -d "$APP" ]; then
            echo "No .app bundle in dist/ — nothing to notarize."
            exit 0
          fi
          ${{ steps.signing.outputs.dir }}/macos-notarize.sh "$APP" "$ZIP"

      - name: Package Windows build
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-Location dist
          Compress-Archive -Path floppybootcd -DestinationPath "floppybootcd-${{ steps.version.outputs.version }}-${{ matrix.label }}.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: floppybootcd-${{ matrix.label }}
          path: dist/floppybootcd-${{ steps.version.outputs.version }}-${{ matrix.label }}.${{ matrix.artifact_ext }}
          if-no-files-found: error
          retention-days: 14

      # Linux-only: separate upload for the AppImage / .deb / .rpm
      # produced by the packaging step above. Kept distinct from the
      # main tar.gz upload so a Linux packaging failure doesn't also
      # kill the tar.gz artifact upload.
      - name: Upload Linux package artifacts
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: floppybootcd-${{ matrix.label }}-packages
          path: |
            dist/floppybootcd-${{ steps.version.outputs.version }}-${{ matrix.label }}.AppImage
            dist/floppybootcd-${{ steps.version.outputs.version }}-${{ matrix.label }}.deb
            dist/floppybootcd-${{ steps.version.outputs.version }}-${{ matrix.label }}.rpm
          if-no-files-found: error
          retention-days: 14

      # Never leave the Developer ID private key in a keychain on a runner,
      # even when an earlier step failed — hence always().
      - name: Clean up signing keychain (macOS)
        if: always() && runner.os == 'macOS' && steps.signing.outputs.dir != ''
        shell: bash
        run: ${{ steps.signing.outputs.dir }}/macos-cleanup-keychain.sh

  # ─── macOS universal2 merge ────────────────────────────────────────────────
  # PySide6 wheels on PyPI are arch-specific — there is no universal2 wheel,
  # so PyInstaller --target-arch universal2 cannot be used directly.  The
  # dual-build + lipo-merge strategy sidesteps this: each macOS runner
  # (arm64 and x86_64) builds a native .app bundle independently; this job
  # downloads both, uses `lipo` to merge every Mach-O binary into a fat
  # universal2 slice, re-applies ad-hoc signatures (lipo invalidates the
  # PyInstaller-generated ones), and re-packages the result as a third
  # artifact alongside the two per-arch zips.
  #
  # The per-arch artifacts are kept so users can still download the smaller
  # architecture-specific bundle if they prefer.
  build-macos-universal2:
    name: Build (macos-universal2)
    needs: build
    runs-on: macos-15

    steps:
      - name: Check out source (for version resolution)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '' && github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      # The checkout above may be a historical tag (the workflow_dispatch
      # smoke-test path), and tags older than this workflow do not contain
      # .github/signing/. Pull the signing tooling from the dispatch
      # revision separately so a rebuild of an old tag is still signed
      # with the current scripts.
      - name: Check out signing tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref }}
          path: .signing-tooling
          sparse-checkout: .github/signing
          sparse-checkout-cone-mode: false
          fetch-depth: 1

      - name: Locate signing tooling
        id: signing
        shell: bash
        run: |
          set -euo pipefail
          DIR=".signing-tooling/.github/signing"
          if [ -x "$DIR/macos-sign.sh" ]; then
            echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          else
            echo "dir=" >> "$GITHUB_OUTPUT"
            echo "::warning::No signing tooling at $DIR — is this a revision that predates macOS signing? macOS bundles will keep their ad-hoc signature."
          fi

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            REF="${GITHUB_REF#refs/tags/}"
          elif [ -n "${{ github.event.inputs.tag }}" ]; then
            REF="${{ github.event.inputs.tag }}"
          else
            REF="dev-$(git rev-parse --short HEAD)"
          fi
          VER="${REF#v}"
          echo "version=${VER}" >> "$GITHUB_OUTPUT"

      - name: Download macOS arm64 artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: floppybootcd-macos-arm64
          path: input/arm64/

      - name: Download macOS x86_64 artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: floppybootcd-macos-x86_64
          path: input/x86_64/

      - name: Unzip per-arch .app bundles
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/arm64 work/x86_64
          ditto -x -k \
            "input/arm64/floppybootcd-${{ steps.version.outputs.version }}-macos-arm64.zip" \
            work/arm64/
          ditto -x -k \
            "input/x86_64/floppybootcd-${{ steps.version.outputs.version }}-macos-x86_64.zip" \
            work/x86_64/

      - name: Merge into universal2 .app
        shell: bash
        run: |
          set -euo pipefail
          ARM64_APP="work/arm64/floppybootcd.app"
          X86_64_APP="work/x86_64/floppybootcd.app"
          UNIVERSAL_APP="work/universal/floppybootcd.app"

          if [ ! -d "$ARM64_APP" ]; then
            echo "ERROR: arm64 bundle not found at $ARM64_APP"
            ls -la work/arm64/
            exit 1
          fi
          if [ ! -d "$X86_64_APP" ]; then
            echo "ERROR: x86_64 bundle not found at $X86_64_APP"
            ls -la work/x86_64/
            exit 1
          fi

          # Use the arm64 bundle as the template.
          # ditto preserves symlinks, resource forks, and ACLs.
          mkdir -p work/universal
          ditto "$ARM64_APP" "$UNIVERSAL_APP"

          merged=0
          already_fat=0
          no_counterpart=0

          # Walk every regular (non-symlink) file in the arm64 bundle.
          # For each Mach-O binary, combine with the x86_64 counterpart
          # using `lipo` to produce a fat universal2 slice.
          # Non-Mach-O files (Python bytecode, data, plists, icons, etc.)
          # are already in the universal bundle from the ditto copy above.
          while IFS= read -r -d '' arm64_file; do
            rel="${arm64_file#${ARM64_APP}/}"
            univ_file="${UNIVERSAL_APP}/${rel}"
            x86_file="${X86_64_APP}/${rel}"

            filetype=$(file -b "$arm64_file" 2>/dev/null || true)
            case "$filetype" in
              *"Mach-O"*) ;;
              *) continue ;;
            esac

            # Already a fat (universal) binary — nothing to merge.
            if [[ "$filetype" == *"universal binary"* ]]; then
              already_fat=$((already_fat + 1))
              continue
            fi

            if [ ! -f "$x86_file" ]; then
              echo "ERROR: no x86_64 counterpart for Mach-O binary: $rel"
              no_counterpart=$((no_counterpart + 1))
              continue
            fi

            lipo -create "$arm64_file" "$x86_file" -output "$univ_file"
            merged=$((merged + 1))
          done < <(find "$ARM64_APP" -not -type d -not -type l -print0)

          echo ""
          echo "universal2 merge complete:"
          echo "  lipo'd:          $merged"
          echo "  already fat:     $already_fat"
          echo "  no x86 partner:  $no_counterpart"

          if [ "$no_counterpart" -gt 0 ]; then
            echo ""
            echo "ERROR: $no_counterpart Mach-O file(s) had no x86_64 counterpart."
            echo "The universal2 bundle would be incomplete and fail on Intel Macs."
            exit 1
          fi

          # Validate that x86_64 contains no Mach-O files absent from arm64.
          # The merge loop above only walks arm64; any extra Mach-O in x86_64
          # would be silently omitted from the universal bundle.
          x86_only=0
          while IFS= read -r -d '' x86_file; do
            rel="${x86_file#${X86_64_APP}/}"
            arm64_counterpart="${ARM64_APP}/${rel}"
            if ! file -b "$x86_file" 2>/dev/null | grep -q "Mach-O"; then
              continue
            fi
            if [ ! -f "$arm64_counterpart" ]; then
              echo "ERROR: Mach-O present in x86_64 but absent from arm64 (omitted from universal bundle): $rel"
              x86_only=$((x86_only + 1))
            fi
          done < <(find "$X86_64_APP" -not -type d -not -type l -print0)

          if [ "$x86_only" -gt 0 ]; then
            echo ""
            echo "ERROR: $x86_only Mach-O file(s) exist only in the x86_64 bundle and would be missing from the universal2 bundle."
            exit 1
          fi

          # The merged bundle is deliberately left unsigned here. lipo
          # invalidates the per-arch signatures, and merging two
          # already-signed thin binaries does not yield a validly signed
          # fat one — the bundle has to be re-signed from scratch. That
          # happens in "Codesign universal2 .app" below, with the same
          # script and entitlements the per-arch builds use, and any
          # notarization ticket inherited from the arm64 template bundle is
          # replaced when the universal bundle is notarized and stapled in
          # its own right.
          echo "Merge complete; the bundle is signed in a later step."

      - name: Verify universal2 binaries
        shell: bash
        run: |
          set -euo pipefail
          UNIVERSAL_APP="work/universal/floppybootcd.app"
          errors=0

          # Required Mach-O binaries: absence is a hard failure.
          for candidate in \
              "Contents/MacOS/floppybootcd"; do
            f="${UNIVERSAL_APP}/${candidate}"
            if [ ! -f "$f" ]; then
              echo "ERROR: required binary not found: $candidate"
              errors=$((errors + 1))
              continue
            fi
            info=$(lipo -info "$f")
            echo "$info"
            if ! echo "$info" | grep -q "x86_64"; then
              echo "ERROR: missing x86_64 slice in $candidate"
              errors=$((errors + 1))
            fi
            if ! echo "$info" | grep -q "arm64"; then
              echo "ERROR: missing arm64 slice in $candidate"
              errors=$((errors + 1))
            fi
          done

          # Optional Mach-O binaries: absence is reported but not fatal.
          for candidate in \
              "Contents/Resources/bin/xorriso"; do
            f="${UNIVERSAL_APP}/${candidate}"
            if [ ! -f "$f" ]; then
              echo "SKIP (not present): $candidate"
              continue
            fi
            info=$(lipo -info "$f")
            echo "$info"
            if ! echo "$info" | grep -q "x86_64"; then
              echo "ERROR: missing x86_64 slice in $candidate"
              errors=$((errors + 1))
            fi
            if ! echo "$info" | grep -q "arm64"; then
              echo "ERROR: missing arm64 slice in $candidate"
              errors=$((errors + 1))
            fi
          done

          # Full arch check for every Mach-O in the bundle.
          # Use NUL-delimited find+sort to handle paths with spaces.
          # This catches any nested Mach-O (dylibs, helpers, etc.) that may
          # have been skipped or left single-arch during the merge step.
          echo ""
          echo "--- Arch check (all Mach-O files) ---"
          while IFS= read -r -d '' f; do
            if ! file -b "$f" 2>/dev/null | grep -q "Mach-O"; then
              continue
            fi
            info=$(lipo -info "$f" 2>/dev/null || true)
            rel="${f#${UNIVERSAL_APP}/}"
            printf '%s  ← %s\n' "$info" "$rel"
            if ! echo "$info" | grep -q "x86_64"; then
              echo "ERROR: missing x86_64 slice in $rel"
              errors=$((errors + 1))
            fi
            if ! echo "$info" | grep -q "arm64"; then
              echo "ERROR: missing arm64 slice in $rel"
              errors=$((errors + 1))
            fi
          done < <(find "$UNIVERSAL_APP" -not -type d -not -type l -print0 | sort -z)

          if [ "$errors" -gt 0 ]; then
            echo ""
            echo "ERROR: $errors verification failure(s). Aborting."
            exit 1
          fi
          echo ""
          echo "All Mach-O binaries in the bundle are universal2. ✓"

      - name: Import Developer ID certificate (universal2)
        if: steps.signing.outputs.dir != ''
        shell: bash
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
        run: ${{ steps.signing.outputs.dir }}/macos-import-cert.sh

      # Signed after the arch verification above (which only reads the
      # binaries) and before packaging below, for the same reason as the
      # per-arch builds: nothing may touch the bundle after it is signed.
      # Unlike the per-arch builds — where PyInstaller leaves its own
      # ad-hoc signature — the merged bundle is unsigned at this point, and
      # an unsigned bundle will not launch on Apple Silicon at all. So when
      # the signing tooling is unavailable, fall back to the ad-hoc
      # signature the merge step used to apply rather than skipping.
      - name: Codesign universal2 .app
        shell: bash
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          set -euo pipefail
          DIR="${{ steps.signing.outputs.dir }}"
          if [ -n "$DIR" ]; then
            "$DIR/macos-sign.sh" work/universal/floppybootcd.app
          else
            echo "::warning::Signing tooling unavailable — ad-hoc signing the universal2 bundle."
            codesign --force --deep --sign - work/universal/floppybootcd.app
          fi

      - name: Package universal2 build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cd work/universal
          ditto -c -k --keepParent --sequesterRsrc \
            "floppybootcd.app" \
            "../../dist/floppybootcd-${{ steps.version.outputs.version }}-macos-universal2.zip"

      # universal2 is a separate binary from the two per-arch bundles, so
      # it needs its own notarization submission — a ticket is issued per
      # artifact, not per release.
      - name: Notarize and staple universal2 build
        if: steps.signing.outputs.dir != ''
        shell: bash
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          set -euo pipefail
          ${{ steps.signing.outputs.dir }}/macos-notarize.sh \
            "work/universal/floppybootcd.app" \
            "dist/floppybootcd-${{ steps.version.outputs.version }}-macos-universal2.zip"

      - name: Upload universal2 artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: floppybootcd-macos-universal2
          path: dist/floppybootcd-${{ steps.version.outputs.version }}-macos-universal2.zip
          if-no-files-found: error
          retention-days: 14

      - name: Clean up signing keychain (universal2)
        if: always() && steps.signing.outputs.dir != ''
        shell: bash
        run: ${{ steps.signing.outputs.dir }}/macos-cleanup-keychain.sh

  release:
    name: Publish release assets
    needs: [build, build-macos-universal2]
    # Both conditions matter: github.ref is also refs/tags/v* when the
    # workflow is dispatched with a tag as its ref (`gh workflow run --ref
    # v1.2.0`), and without the event check such a manual run would publish
    # to — or overwrite the assets on — that existing Release.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts
          pattern: floppybootcd-*
          merge-multiple: true

      - name: List collected artifacts
        run: ls -la artifacts

      - name: Attach binaries to GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          files: artifacts/*
          fail_on_unmatched_files: true
          generate_release_notes: true

      # Tell POSTBEEP.NET to rebuild here, as the last step of the release
      # job, after the assets are attached above. notify-postbeep.yml no
      # longer triggers on `release:`: firing on `release: published` raced
      # this upload and the catalog mirrored an asset-less release. Skips
      # cleanly when the dispatch PAT isn't set so a missing secret doesn't
      # fail an otherwise-good release.
      - name: Notify POSTBEEP.NET (after assets are uploaded)
        env:
          GH_TOKEN: ${{ secrets.POSTBEEP_DISPATCH_PAT }}
          PROJECT: ${{ github.event.repository.name }}
          OWNER:   ${{ github.repository_owner }}
          RELEASE: ${{ github.ref_name }}
          REF:     ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "POSTBEEP_DISPATCH_PAT not set; skipping POSTBEEP.NET dispatch."
            exit 0
          fi
          jq -n \
            --arg project "$PROJECT" \
            --arg owner "$OWNER" \
            --arg release "$RELEASE" \
            --arg ref "$REF" \
            --arg reason "release" \
            '{event_type: "project-update", client_payload: {project: $project, owner: $owner, release: $release, ref: $ref, reason: $reason}}' \
            | gh api repos/pacnpal/POSTBEEPNET/dispatches --method POST --input -
