name: Release Binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to check out for a smoke-test build (e.g. v0.1.0). Leave blank to build the dispatch ref. Manual runs NEVER publish to a Release; only pushed v* tags do."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x86_64
            artifact_ext: tar.gz
          - os: macos-15-intel
            label: macos-x86_64
            artifact_ext: zip
          - os: macos-15
            label: macos-arm64
            artifact_ext: zip
          - os: windows-latest
            label: windows-x86_64
            artifact_ext: zip

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '' && github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libxkbcommon0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-sync1 \
            libxcb-xfixes0 \
            libxcb-xinerama0 \
            libxcb-xkb1 \
            libxkbcommon-x11-0 \
            libdbus-1-3 \
            libfontconfig1 \
            libxrender1 \
            libsm6 \
            libice6

      - name: Install Python dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
          python -m pip install pyinstaller

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            REF="${GITHUB_REF#refs/tags/}"
          elif [ -n "${{ github.event.inputs.tag }}" ]; then
            REF="${{ github.event.inputs.tag }}"
          else
            REF="dev-$(git rev-parse --short HEAD)"
          fi
          # Strip leading "v" for use in artifact names.
          VER="${REF#v}"
          echo "tag=${REF}" >> "$GITHUB_OUTPUT"
          echo "version=${VER}" >> "$GITHUB_OUTPUT"

      - name: Build with PyInstaller
        shell: bash
        env:
          PYTHONOPTIMIZE: "1"
        run: |
          pyinstaller \
            --noconfirm \
            --clean \
            --name floppybootcd \
            --windowed \
            --collect-submodules floppybootcd \
            --collect-all PySide6 \
            floppybootcd/__main__.py

      - name: Package Linux build
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cd dist
          tar -czf "floppybootcd-${{ steps.version.outputs.version }}-${{ matrix.label }}.tar.gz" floppybootcd

      - name: Package macOS build
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cd dist
          # --windowed on macOS produces floppybootcd.app alongside the
          # plain binary directory. Ship the .app bundle.
          if [ -d "floppybootcd.app" ]; then
            ditto -c -k --keepParent --sequesterRsrc \
              "floppybootcd.app" \
              "floppybootcd-${{ steps.version.outputs.version }}-${{ matrix.label }}.zip"
          else
            ditto -c -k --keepParent --sequesterRsrc \
              "floppybootcd" \
              "floppybootcd-${{ steps.version.outputs.version }}-${{ matrix.label }}.zip"
          fi

      - name: Package Windows build
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-Location dist
          Compress-Archive -Path floppybootcd -DestinationPath "floppybootcd-${{ steps.version.outputs.version }}-${{ matrix.label }}.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: floppybootcd-${{ matrix.label }}
          path: dist/floppybootcd-${{ steps.version.outputs.version }}-${{ matrix.label }}.${{ matrix.artifact_ext }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish release assets
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List collected artifacts
        run: ls -la artifacts

      - name: Attach binaries to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          fail_on_unmatched_files: true
          generate_release_notes: true
